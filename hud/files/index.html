<!DOCTYPE html>

<html>
	<head>
		<style>
			.table {
				width: fit-content;
			}

			.table > .entry {
				border: 1px solid green;
				display: grid;
				grid-template-columns: repeat(7, 1fr);
			}
		</style>
	</head>
	<body>
		<script async>
			let headers = new Headers();
			async function watch(path) {
				//console.log(`Fetching ${path}`, headers);

				let x;
				x = await fetch("/entities.json", { headers: headers });

				// Sometimes on refreshes, mgmt will report "server shutting down"
				// Let's ignore those.
				if (!x.ok) {
					console.log("Request was not ok", x);
					return;
				}

				let t = await x.text();

				try {
					JSON.parse(t);
				} catch (e) {
					console.error("JSON parse failed. Contents:", t);
					throw e;
				}
				let data = JSON.parse(t);

				if (x.headers.has("last-modified")) {
					headers.set("If-Modified-Since", x.headers.get("last-modified"))
				}


				let container = document.createElement("div");
				container.classList.add("table");

				function cell(klass, text) {
					const el = document.createElement("div");
					el.classList.add(klass)
					el.innerText = text + "(" + klass + ")";
					return el;
				}

				for (const [k,v] of Object.entries(data).sort()) {
					let el = document.createElement("div");
					el.classList.add("entry");

					let children = [
						cell("name", k)
						, cell("os", v.os)
						, cell("now", v.now)
						, cell("cpu", v.cpu)
						, cell("memory", v.memory)
					];

					el.replaceChildren(...children);

					//console.log(el);
					container.appendChild(el);
				}

				document.body.replaceChildren(container);
			}

			(async () => {
				while (true) {
					try {
						await watch("/entities.json");
					} catch (e) {
						console.error("Error while fetching, will retry shortly.", e);
						await new Promise((resolve) => {
							setTimeout(() => resolve(), 1000);
						});
					}
				}
			})();
				
		</script>
	</body>
</html>
