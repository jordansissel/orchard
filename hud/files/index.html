<!DOCTYPE html>

<html>
	<head>
		<style>
			.table {
				width: fit-content;
				display: grid;
				grid-template-columns: repeat(6, 1fr);
				gap: 1rem;
				border: 1px solid green;
				background-color: rgb(from orange r g b / 50%);
				margin: 1rem;
				padding: 1rem;
				font-family: monospace, sans-serif;
			}

			.table *:nth-child(-n + 6) {
				border-bottom: 1px solid red;
				font-weight: bold;
			}

			.table .uuid
			, .table .machine-id {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: pre;
			}

			.table > .entry {
			}
		</style>
	</head>
	<body>
		<script async>
			let headers = new Headers();
			async function watch(path) {
				//console.log(`Fetching ${path}`, headers);

				let x;
				x = await fetch("/entities.json", { headers: headers });

				// Sometimes on refreshes, mgmt will report "server shutting down"
				// Let's ignore those.
				if (!x.ok) {
					console.log("Request was not ok", x);
					return;
				}

				let t = await x.text();

				try {
					JSON.parse(t);
				} catch (e) {
					console.error("JSON parse failed. Contents:", t);
					throw e;
				}
				let data = JSON.parse(t);

				if (x.headers.has("last-modified")) {
					headers.set("If-Modified-Since", x.headers.get("last-modified"))
				}


				let container = document.createElement("div");
				container.classList.add("table");

				function cell(klass, text) {
					const el = document.createElement("div");
					el.classList.add(klass)
					el.innerText = text;
					return el;
				}

				let header = document.createDocumentFragment();
				header.replaceChildren(
					cell("name", "Name")
					, cell("os", "OS")
					, cell("cpu", "CPU")
					, cell("memory", "Memory")
					, cell("uuid", "UUID")
					, cell("machine-id", "Machine ID")
				);
				container.appendChild(header);


				for (const [k,v] of Object.entries(data).sort()) {
					//let el = document.createElement("div");
					let el = document.createDocumentFragment();
					//el.classList.add("entry");

					let children = [
						cell("name", k)
						, cell("os", v.os)
						, cell("cpu", v.cpu)
						, cell("memory", Intl.NumberFormat("en-US", { maximumFractionDigits: 2, style: "unit", unit: "gigabyte" }).format(parseInt(v.memory) / 1024.0 / 1024.0))
						, cell("uuid", v.uuid)
						, cell("machine-id", v["machine-id"])
					];

					el.replaceChildren(...children);

					//console.log(el);
					container.appendChild(el);
				}

				document.body.replaceChildren(container);
			}

			(async () => {
				while (true) {
					try {
						await watch("/entities.json");
					} catch (e) {
						console.error("Error while fetching, will retry shortly.", e);
						await new Promise((resolve) => {
							setTimeout(() => resolve(), 1000);
						});
					}
				}
			})();
				
		</script>
	</body>
</html>
